services:
  cgroups-stat:
    image: cgroups-stat:latest
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9200:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000